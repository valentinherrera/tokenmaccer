name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, app-distribution]
  pull_request:

# Every check lives in scripts/preflight.sh, the same chain release.sh runs before a build.
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - name: Install shellcheck
        run: brew install --quiet shellcheck
      - name: Python, shell scripts, edge functions
        run: scripts/preflight.sh python shell deno

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install --quiet xcodegen
      - name: Builds, XCTest, parity, strings, release lock, preview
        run: scripts/preflight.sh swift
