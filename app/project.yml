# XcodeGen spec. Signing team and bundle prefix are passed at build time, e.g.
#   xcodebuild ... DEVELOPMENT_TEAM=ABCDE12345 BUNDLE_ID_PREFIX=com.yourname
# install.sh does this for you.
name: TokenMaccer
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  TokenMaccer:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TokenMaccer
        LSApplicationCategoryType: public.app-category.developer-tools
        TMAppGroup: $(DEVELOPMENT_TEAM).tokenmaccer
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).tokenmaccer]
        com.apple.security.temporary-exception.files.home-relative-path.read-only: [/.claude/tools/tokenmaccer/]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tokenmaccer
    dependencies:
      - target: TokenMaccerWidget
  TokenMaccerWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TokenMaccer
        TMAppGroup: $(DEVELOPMENT_TEAM).tokenmaccer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).tokenmaccer]
        com.apple.security.temporary-exception.files.home-relative-path.read-only: [/.claude/tools/tokenmaccer/]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tokenmaccer.widget
