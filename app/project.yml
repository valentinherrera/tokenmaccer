# XcodeGen spec. Signing team and bundle prefix are passed at build time, e.g.
#   xcodebuild ... DEVELOPMENT_TEAM=ABCDE12345 BUNDLE_ID_PREFIX=com.yourname
# install.sh does this for you.
#
# Two editions from the same targets, chosen by the build setting TM_EDITION:
#   source (default)  install.sh: sandboxed app, the Python collector writes ~/.claude/tools/tokenmaccer/
#   app               the downloadable app: unsandboxed app with the Swift collector as background agent,
#                     widget reads the App Group container. Build with -xcconfig AppEdition.xcconfig.
# The TM_*_ENTITLEMENTS indirection lets one xcconfig switch the entitlements of every target.
name: TokenMaccer
options:
  deploymentTarget:
    macOS: "15.0"
  # English source strings, German from Shared/Localizable.xcstrings (String Catalog): app and widget both compile
  # it (Shared is in both targets); the bundled collector runs inside TokenMaccer.app and reads the app's copy
  developmentLanguage: en
# Sparkle 2 (updates for the app edition; the source edition links it but never starts the updater)
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # every build writes the localizable strings it finds (.stringsdata); scripts/check_strings.py compares them
    # with the String Catalog, so a new string without German fails CI
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "17"
    ENABLE_HARDENED_RUNTIME: YES
    TM_EDITION: source
    TM_APP_ENTITLEMENTS: App/App.entitlements
    TM_WIDGET_ENTITLEMENTS: Widget/Widget.entitlements
    TM_COLLECTOR_ENTITLEMENTS: ""
    TM_AGENT_LABEL: $(BUNDLE_ID_PREFIX).tokenmaccer.collector
    # Sparkle public EdDSA key of the maintainer's releases (generate_keys -p); a fork sets its own
    TM_SPARKLE_PUBLIC_KEY: Y/TDiDxTGXf6M5C6aHm6wXDO5QaFplSqJomzL91b3wU=
targets:
  TokenMaccer:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      # leaderboard server address for the sign-in (the collector links the same file, see below)
      - path: ../supabase/app-config.json
        buildPhase: resources
      # the privacy notice the consent opens in a sheet (PrivacyNotice.bundledMarkdown), readable offline
      - path: ../docs/privacy.md
        buildPhase: resources
      - path: ../docs/privacy.de.md
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TokenMaccer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # English is the source language (no en.lproj is built from the String Catalog): without this list an
        # English system would fall through to the only lproj there is, German
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        LSApplicationCategoryType: public.app-category.developer-tools
        TMAppGroup: $(DEVELOPMENT_TEAM).tokenmaccer
        TMEdition: $(TM_EDITION)
        TMAgentPlist: $(TM_AGENT_LABEL).plist
        # callback of the leaderboard's GitHub sign-in (ASWebAuthenticationSession catches it)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).auth-callback
            CFBundleURLSchemes: [tokenmaccer]
        # Sparkle: release feed and the public EdDSA key (the private key stays in the keychain of the
        # release machine). A test feed is set per machine only: defaults write <bundle id> SUFeedURL <url>
        SUFeedURL: https://github.com/valentinherrera/tokenmaccer/releases/latest/download/appcast.xml
        SUPublicEDKey: $(TM_SPARKLE_PUBLIC_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tokenmaccer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: $(TM_APP_ENTITLEMENTS)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: TokenMaccerWidget
      - target: TokenMaccerCore
      - package: Sparkle
      # built always, embedded only in the app edition (script below)
      - target: tokenmaccer-collector
        link: false
        embed: false
    postBuildScripts:
      - name: Embed background collector (app edition)
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          contents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          if [ "$TM_EDITION" != "app" ]; then
            rm -rf "$contents/MacOS/tokenmaccer-collector" "$contents/Library/LaunchAgents"
            exit 0
          fi
          # already signed by its own target (hardened runtime, App Group); ditto keeps the signature
          ditto "$BUILT_PRODUCTS_DIR/tokenmaccer-collector" "$contents/MacOS/tokenmaccer-collector"
          agents="$contents/Library/LaunchAgents"
          plist="$agents/$TM_AGENT_LABEL.plist"
          mkdir -p "$agents"
          rm -f "$plist"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$plist" >/dev/null; }
          pb "Add :Label string $TM_AGENT_LABEL"
          pb "Add :BundleProgram string Contents/MacOS/tokenmaccer-collector"
          pb "Add :ProgramArguments array"
          pb "Add :ProgramArguments:0 string tokenmaccer-collector"
          pb "Add :ProgramArguments:1 string --app-group"
          pb "Add :ProgramArguments:2 string $DEVELOPMENT_TEAM.tokenmaccer"
          pb "Add :AssociatedBundleIdentifiers array"
          pb "Add :AssociatedBundleIdentifiers:0 string $PRODUCT_BUNDLE_IDENTIFIER"
          pb "Add :StartInterval integer 300"
          pb "Add :RunAtLoad bool true"
          pb "Add :ProcessType string Background"
          pb "Add :LowPriorityIO bool true"
          pb "Add :Nice integer 10"
          plutil -convert xml1 "$plist"
      - name: Sign Sparkle helpers (Developer ID, hardened runtime)
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          # Sparkle ships its helpers ad-hoc signed; Xcode re-signs only the framework on copy. Sign them inside
          # out with our identity before Xcode seals the app (notarization rejects ad-hoc code).
          spk="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          if [ ! -d "$spk" ] || [ "${CODE_SIGNING_ALLOWED:-YES}" != YES ] || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] \
            || [ "$EXPANDED_CODE_SIGN_IDENTITY" = "-" ]; then
            exit 0
          fi
          sign() { codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$@"; }
          v="$spk/Versions/B"
          sign "$v/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$v/XPCServices/Downloader.xpc"
          sign --identifier org.sparkle-project.Sparkle.Autoupdate "$v/Autoupdate"
          sign "$v/Updater.app"
          sign "$spk"
    # explicit schemes: once one shared scheme exists Xcode stops generating the others
    scheme: {}
  TokenMaccerWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: TokenMaccer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # same as the app: English source, German from the String Catalog (without the list an English system
        # would get the only lproj there is, German)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        TMAppGroup: $(DEVELOPMENT_TEAM).tokenmaccer
        TMEdition: $(TM_EDITION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tokenmaccer.widget
        CODE_SIGN_ENTITLEMENTS: $(TM_WIDGET_ENTITLEMENTS)
  # Swift port of collector/collector.py (same numbers, see scripts/compare_collectors.py).
  # The app edition embeds the command-line tool as a background agent (SMAppService).
  TokenMaccerCore:
    type: library.static
    platform: macOS
    sources: [Collector/Core]
    settings:
      base:
        PRODUCT_NAME: TokenMaccerCore
        SKIP_INSTALL: YES
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
  tokenmaccer-collector:
    type: tool
    platform: macOS
    sources: [Collector/CLI]
    dependencies:
      - target: TokenMaccerCore
    scheme:
      testTargets: [TokenMaccerCoreTests]
    settings:
      base:
        PRODUCT_NAME: tokenmaccer-collector
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tokenmaccer.collector
        CODE_SIGN_ENTITLEMENTS: $(TM_COLLECTOR_ENTITLEMENTS)
        # embedded Info.plist: gives the signature the bundle identifier instead of the file name
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        # prices.json is linked into the binary (single source, read via getsectiondata).
        # The linker does not track it: after a price change build clean (release builds always do).
        # supabase/app-config.json likewise (leaderboard server address, only used after opt-in)
        OTHER_LDFLAGS:
          - "-sectcreate"
          - "__TEXT"
          - "__prices_json"
          - "$(PROJECT_DIR)/../collector/prices.json"
          - "-sectcreate"
          - "__TEXT"
          - "__lb_config"
          - "$(PROJECT_DIR)/../supabase/app-config.json"
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
  TokenMaccerCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Collector/Tests
      # widget read outcomes and the status the app edition shows (WidgetHealthTests)
      - Shared/Model.swift
      - Shared/WidgetHealth.swift
      - Shared/SelfHealPlan.swift
      - Shared/OnboardingPlan.swift
      - Shared/PrivacyText.swift
      - path: ../collector/prices.json
        buildPhase: resources
    dependencies:
      - target: TokenMaccerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tokenmaccer.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
