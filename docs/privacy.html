<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenMaccer privacy notice</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/icon.png">
<!-- https://tokenmaccer.app/privacy (English) and /privacy/de (German, vercel.json rewrites it here). The text is
     docs/privacy.md and docs/privacy.de.md, the same files the app bundles, loaded from this site and rendered by the
     small converter below, so there is one source and no build step. The converter covers what those two files use:
     headings, paragraphs, lists, one table, **bold**, `code`, [links](…) and <autolinks>. -->
<link rel="stylesheet" href="/assets/colors.css">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--color-bg); color: var(--color-text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  a { color: var(--color-accent); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; color: var(--color-text); text-decoration: none; }
  .brand img { width: 32px; height: 32px; }
  main { padding: 8px 0 32px; overflow-wrap: anywhere; }
  h1 { font-size: 36px; line-height: 1.1; letter-spacing: -0.01em; margin: 16px 0 12px; }
  h2 { font-size: 24px; margin: 40px 0 10px; padding-top: 24px; border-top: 1px solid var(--color-border); }
  h3 { font-size: 19px; margin: 28px 0 8px; }
  p, li { max-width: 44em; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; background: var(--color-surface); padding: 1px 5px; border-radius: 5px; }
  .table { overflow-x: auto; margin: 16px 0; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); }
  table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
  tr:last-child td { border-bottom: 0; }
  th { font-weight: 650; }
  td code { background: var(--color-bg); }
  .status { color: var(--color-text-secondary); }
  footer { border-top: 1px solid var(--color-border); padding: 24px 0 44px; color: var(--color-text-secondary); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="brand" href="/"><img src="/assets/icon.png" alt="">TokenMaccer</a></header>
  <main id="doc"><p class="status">Loading… <a id="raw" href="/privacy.md">Plain text</a></p></main>
  <footer><a href="/">tokenmaccer.app</a> · <a href="https://github.com/valentinherrera/tokenmaccer">GitHub</a></footer>
</div>
<script>
  (function () {
    var german = /^\/privacy\/de\/?$/.test(location.pathname) || new URLSearchParams(location.search).get('lang') === 'de';
    var file = german ? '/privacy.de.md' : '/privacy.md';
    document.documentElement.lang = german ? 'de' : 'en';
    document.getElementById('raw').setAttribute('href', file);

    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    // Links between the two notices go to their pages here; everything else keeps its target.
    function target(href) {
      if (href === 'privacy.md') return '/privacy';
      if (href === 'privacy.de.md') return '/privacy/de';
      return href;
    }
    function inline(text) {
      var out = '', re = /`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|<(https?:\/\/[^>\s]+)>|\*\*(.+?)\*\*/g, last = 0, m;
      while ((m = re.exec(text))) {
        out += esc(text.slice(last, m.index));
        if (m[1] !== undefined) out += '<code>' + esc(m[1]) + '</code>';
        else if (m[2] !== undefined) out += '<a href="' + esc(target(m[3])) + '">' + inline(m[2]) + '</a>';
        else if (m[4] !== undefined) out += '<a href="' + esc(m[4]) + '">' + esc(m[4]) + '</a>';
        else out += '<strong>' + inline(m[5]) + '</strong>';
        last = re.lastIndex;
      }
      return out + esc(text.slice(last));
    }
    function cells(line) { return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); }); }
    function render(md) {
      var lines = md.replace(/\r\n/g, '\n').split('\n'), html = '', i = 0;
      while (i < lines.length) {
        var line = lines[i];
        if (!line.trim()) { i++; continue; }
        var h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) { html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; i++; continue; }
        if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
          var head = cells(line), rows = '';
          i += 2;
          while (i < lines.length && /^\s*\|/.test(lines[i])) {
            rows += '<tr>' + cells(lines[i]).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
            i++;
          }
          html += '<div class="table"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
            '</tr></thead><tbody>' + rows + '</tbody></table></div>';
          continue;
        }
        if (/^[-*]\s+/.test(line)) {
          var items = '';
          while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
            var item = lines[i].replace(/^[-*]\s+/, '');
            i++;
            while (i < lines.length && /^\s{2,}\S/.test(lines[i])) { item += ' ' + lines[i].trim(); i++; }
            items += '<li>' + inline(item) + '</li>';
          }
          html += '<ul>' + items + '</ul>';
          continue;
        }
        var para = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|[-*]\s|\s*\|)/.test(lines[i])) { para.push(lines[i].trim()); i++; }
        html += '<p>' + inline(para.join(' ')) + '</p>';
      }
      return html;
    }

    fetch(file, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (md) {
      document.getElementById('doc').innerHTML = render(md);
      var h1 = document.querySelector('#doc h1');
      if (h1) document.title = h1.textContent;
    }).catch(function () {
      document.getElementById('doc').innerHTML = '<p class="status">' + (german
        ? 'Der Datenschutzhinweis konnte nicht geladen werden. <a href="' + file + '">Als Text öffnen</a>'
        : 'The privacy notice could not be loaded. <a href="' + file + '">Open as plain text</a>') + '</p>';
    });
  })();
</script>
</body>
</html>
